name: Build Windows Binaries

on:
  push:
    branches: [main]
    tags: ["v*"] # trigger a Release on tag push
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86
            detours_proc: X86
            libdir: lib.X86
            dllname: RdpBypass32.dll
            machine: 14C machine (x86)
          - arch: x64
            detours_proc: X64
            libdir: lib.X64
            dllname: RdpBypass64.dll
            machine: 8664 machine (x64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Clone and Build Detours (pinned v4.0.1)
        run: |
          git clone --branch v4.0.1 --depth 1 https://github.com/microsoft/Detours.git
          cd Detours\src
          nmake DETOURS_TARGET_PROCESSOR=${{ matrix.detours_proc }}
        shell: cmd

      - name: Build ${{ matrix.dllname }}
        run: |
          cl /nologo /W4 /O2 /MT /LD ^
            /I Detours\include ^
            src\RdpBypass.cpp ^
            /Fe:${{ matrix.dllname }} ^
            /link /LIBPATH:Detours\${{ matrix.libdir }} detours.lib user32.lib kernel32.lib
        shell: cmd

      - name: Verify build artifacts
        run: |
          echo === Verify ${{ matrix.dllname }} exists ===
          if not exist ${{ matrix.dllname }} (
            echo FAIL: ${{ matrix.dllname }} not found
            exit /b 1
          )

          echo === Verify architecture (${{ matrix.arch }}) ===
          dumpbin /headers ${{ matrix.dllname }} | findstr /c:"${{ matrix.machine }}" >nul
          if %errorlevel% neq 0 (
            echo FAIL: ${{ matrix.dllname }} is not ${{ matrix.arch }}
            exit /b 1
          )
          echo PASS: architecture is ${{ matrix.arch }}

          echo === Verify dependencies are system-only ===
          dumpbin /dependents ${{ matrix.dllname }} | findstr /i "VCRUNTIME MSVCP MSVCR" >nul
          if %errorlevel% equ 0 (
            echo FAIL: ${{ matrix.dllname }} has VC runtime dependency
            exit /b 1
          )
          echo PASS: no VC runtime dependency

          echo === Full dependency list ===
          dumpbin /dependents ${{ matrix.dllname }}
        shell: cmd

      - name: Upload per-arch DLL
        uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.arch }}
          path: ${{ matrix.dllname }}
          retention-days: 90

  # ------------------------------------------------------------------
  #  Bundle job: combine the x86 + x64 DLLs and installer scripts into one package
  # ------------------------------------------------------------------
  bundle:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x86 DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-x86
          path: dlls

      - name: Download x64 DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-x64
          path: dlls

      - name: Assemble bundle
        run: |
          mkdir release
          copy dlls\RdpBypass32.dll release\
          copy dlls\RdpBypass64.dll release\
          copy scripts\Install.bat release\
          copy scripts\Uninstall.bat release\
          copy README.md release\
          dir release\
        shell: cmd

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: rdp-bypass-bundle
          path: release/
          retention-days: 90

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: powershell Compress-Archive -Path release\* -DestinationPath rdp-bypass-bundle.zip
        shell: cmd

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rdp-bypass-bundle.zip
          generate_release_notes: true
          body: |
            ## RdpBypass ${{ github.ref_name }}

            Unzip, then right-click `Install.bat` -> Run as administrator (installs x86 + x64).

            ### Contents
            | File | Description |
            |------|-------------|
            | `RdpBypass32.dll` | Hook DLL (x86, statically linked, depends only on kernel32 + user32) |
            | `RdpBypass64.dll` | Hook DLL (x64, statically linked, depends only on kernel32 + user32) |
            | `Install.bat` | One-click install for x86 + x64 (idempotent, backs up the registry) |
            | `Uninstall.bat` | One-click uninstall (restores from backup) |
            | `README.md` | Usage |
